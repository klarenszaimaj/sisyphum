<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
     <link rel="icon" href="/favicon.ico" sizes="48x48" />
   <link rel="icon" href="/icona.svg" type="image/svg+xml" />
   <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
   <meta name="theme-color" content="#070912" />
   <meta name="description" content="Planner personale per lo studio universitario" />
   <meta name="apple-mobile-web-app-capable" content="yes" />
   <meta name="apple-mobile-web-app-status-bar-style" content="black" />
   <meta name="apple-mobile-web-app-title" content="StudyFlow" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>StudyFlow</title>
  <script>
    try {
      // Notte è il predefinito: si passa al Giorno solo se l'hai scelto tu
      const scuro = localStorage.getItem('tema') !== 'chiaro';
      document.documentElement.classList.toggle('dark', scuro);

      // Atmosfera: la tua scelta, altrimenti Focus se il sistema chiede meno movimento
      const a = localStorage.getItem('atmosfera');
      document.documentElement.dataset.atmosfera =
        a === 'ambient' || a === 'focus' ? a
          : matchMedia('(prefers-reduced-motion: reduce)').matches ? 'focus' : 'ambient';
    } catch {
      document.documentElement.classList.add('dark');
      document.documentElement.dataset.atmosfera = 'ambient';
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
